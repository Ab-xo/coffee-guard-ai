[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "coffee-guard-ai"
version = "0.1.0"
description = "Explainable, robust coffee leaf disease classification for Ethiopian coffee"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CoffeeGuard AI" }]
keywords = ["computer-vision", "deep-learning", "agriculture", "coffee", "efficientnet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core: everything the slim inference path and the CLI shell need.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
inference = ["onnxruntime>=1.18"]
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0.9",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "opencv-python>=4.9",
    "imagehash>=4.3",
    "cleanlab>=2.6",
    "onnx>=1.16",
    "grad-cam>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "kaggle>=1.6",
]
api = [
    "coffee-guard-ai[inference]",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
]
web = ["streamlit>=1.36", "httpx>=0.27"]

[project.scripts]
coffeeguard = "coffeeguard.cli:app"

[project.urls]
Repository = "https://github.com/Ab-xo/coffee-guard-ai"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
    "httpx>=0.27",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "coffeeguard"

# Local development is CPU-only; GPU training happens on Kaggle, which ships its own CUDA torch.
# PyPI's Windows/macOS wheels are already CPU-only; on Linux (CI, Docker) use the CPU index
# to avoid pulling ~2 GB of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "*.md"]  # leave code snippets in docs untouched

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ×, ≥ etc. in strings and comments

[tool.ruff.lint.isort]
known-first-party = ["coffeeguard", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/api", "apps/web"]  # `tests.*` fixtures, the API package `app`, the UI package `ui`
addopts = ["-q", "--strict-markers"]
markers = [
    "slow: tests that train or export a model (deselect with -m 'not slow')",
    "ml: tests that need the [ml] extra (torch, timm, ...)",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
